<section class="faq" data-accordion="@@faqId">
  <div class="container">
    <h2 class="section-title">Частые вопросы</h2>
    <div class="faq__list">
      <div class="faq__item" data-accordion-item>
        <button class="faq__button" type="button" data-accordion-button aria-expanded="false" aria-controls="@@faqId-q1">Что это за&nbsp;проект?</button>
        <div class="faq__panel" id="@@faqId-q1" data-accordion-panel hidden>
          <p>Это синтетический демонстрационный проект для&nbsp;валидации Forge WordPress без&nbsp;клиентских данных.</p>
        </div>
      </div>
      <div class="faq__item" data-accordion-item>
        <button class="faq__button" type="button" data-accordion-button aria-expanded="false" aria-controls="@@faqId-q2">Используются ли&nbsp;реальные услуги?</button>
        <div class="faq__panel" id="@@faqId-q2" data-accordion-panel hidden>
          <p>Нет. Все услуги и&nbsp;тексты искусственные: «Тестовая услуга», «Демонстрационный проект».</p>
        </div>
      </div>
      <div class="faq__item" data-accordion-item>
        <button class="faq__button" type="button" data-accordion-button aria-expanded="false" aria-controls="@@faqId-q3">Есть ли&nbsp;production target?</button>
        <div class="faq__panel" id="@@faqId-q3" data-accordion-panel hidden>
          <p>Нет. WPilot handoff выполняется только в&nbsp;режиме simulation.</p>
        </div>
      </div>
    </div>
  </div>
</section>
