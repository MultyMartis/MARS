<header class="site-header">
    <div class="tm-container tm-container--wide site-header__inner">
        <a class="site-header__brand" href="index.html">
            @@include('partials/components/brand-lockup-inner.html', { "logoClass": "site-header__logo-img" })
            <span class="site-header__brand-tagline">Услуги манипулятора</span>
        </a>

        <nav class="site-header__nav" aria-label="Основная навигация">
            <ul class="site-header__menu">

        <div class="site-header__actions">
            <div class="site-header__contact">
                <a class="site-header__phone-row" href="tel:+79385005010">
                    <span class="site-header__phone-icon" aria-hidden="true">
                        <i class="fas fa-phone"></i>
                    </span>
                    <span class="site-header__phone-num">+7 (938) 500-50-10</span>
                </a>
                <p class="site-header__schedule">Ежедневно с 7:00 до 20:00</p>
            </div>
            <ul class="site-header__social" aria-label="Мессенджеры">
                <li>
                    <a
                        class="site-header__social-btn site-header__social-btn--wa"
                        href="https://wa.me/79385005010"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Написать в WhatsApp"
                    >
                        <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    </a>
                </li>
                <li>
                    <a
                        class="site-header__social-btn site-header__social-btn--tg"
                        href="https://t.me/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Написать в Telegram"
                    >
                        <i class="fab fa-telegram-plane" aria-hidden="true"></i>
                    </a>
                </li>
                <li>
                    <a
                        class="site-header__social-btn site-header__social-btn--max"
                        href="https://max.ru/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Открыть MAX"
                    >
                        <img
                            class="site-header__social-max-img"

                            height="22"
                            alt=""
                            decoding="async"
