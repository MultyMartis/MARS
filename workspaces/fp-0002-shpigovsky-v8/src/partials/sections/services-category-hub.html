<section class="services-category-hub @@modifierClass" aria-labelledby="@@sectionId">
  <div class="services-category-hub__decor" aria-hidden="true">
    <img class="services-category-hub__decor-image" src="@@decorImage" width="953" height="988" alt="">
  </div>
  <div class="container services-category-hub__container">
    <div class="services-category-hub__head">
      <h2 class="services-category-hub__heading" id="@@sectionId">@@heading</h2>
    </div>

    <p class="services-category-hub__lead">@@leadPrimary</p>
    <p class="services-category-hub__lead services-category-hub__lead--secondary">@@leadSecondary</p>

    <div class="services-category-hub__services">
      @@servicesHtml
    </div>

    <div class="services-category-hub__gallery">
      @@galleryHtml
    </div>

    <div class="services-category-hub__actions">
      <button
        type="button"
        class="btn btn_dark btn--primary services-category-hub__cta"
        data-modal-open="consultation"
        data-modal-source="@@ctaSource"
        data-modal-title="@@ctaText"
        data-modal-submit-text="@@ctaText"
      >
        @@ctaText
      </button>
    </div>
  </div>
</section>
