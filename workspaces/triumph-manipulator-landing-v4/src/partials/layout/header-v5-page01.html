<header class="site-header" aria-label="Навигация сайта">
    <div class="site-header__inner">
        <a class="site-header__brand" href="#top" aria-label="Триумф — к&nbsp;первому экрану">
            <img src="/assets/img/brand/logo--white.svg" alt="Триумф" width="324" height="60" decoding="async">
        </a>

        <nav class="site-header__nav" aria-label="Основная навигация">
            <a class="site-header__nav-link" href="#tasks">Что делаем?</a>
            <a class="site-header__nav-link" href="#pricing">Цены</a>
            <a class="site-header__nav-link" href="#reviews">Отзывы</a>
            <a class="site-header__nav-link" href="#faq">Частые вопросы</a>
            <a class="site-header__nav-link" href="#contacts">Контакты</a>
        </nav>

        <div class="site-header__actions">
            <a class="site-header__phone" href="tel:+79004658331">+7&nbsp;(900)&nbsp;465-83-31</a>
            <div class="site-header__messengers" aria-label="Мессенджеры">
                <a class="site-header__messenger" href="#contacts" aria-label="Написать в&nbsp;MAX">
                    <img src="/assets/img/social/MAX-ico.svg" alt="" width="22" height="22" decoding="async">
                </a>
                <a class="site-header__messenger" href="https://t.me/" target="_blank" rel="noopener noreferrer" aria-label="Написать в&nbsp;Telegram">
                    <img src="/assets/img/social/Telegram-ico.svg" alt="" width="22" height="22" decoding="async">
                </a>
                <a class="site-header__messenger" href="https://wa.me/79004658331" target="_blank" rel="noopener noreferrer" aria-label="Написать в&nbsp;WhatsApp">
                    <img src="/assets/img/social/WhatsApp-ico.svg" alt="" width="22" height="22" decoding="async">
                </a>
            </div>
            <a class="site-header__cta" href="#contacts" data-modal-open="modal-callback" data-cta-source="@@prefix-header-cta" data-modal-title="Заказать звонок оператора">Заказать звонок оператора</a>
        </div>

        <button
            class="site-header__burger"
            type="button"
            aria-expanded="false"
            aria-controls="site-header-drawer"
            aria-label="Открыть меню"
        >
            <span class="site-header__burger-box" aria-hidden="true">
                <span class="site-header__burger-line"></span>
                <span class="site-header__burger-line"></span>
                <span class="site-header__burger-line"></span>
            </span>
        </button>
    </div>

    <div class="site-header__overlay" data-header-overlay aria-hidden="true"></div>

    <aside
        class="site-header__drawer"
        id="site-header-drawer"
        aria-hidden="true"
        aria-label="Мобильное меню"
        tabindex="-1"
    >
        <div class="site-header__drawer-head">
            <span class="site-header__drawer-label">Меню</span>
            <button class="site-header__drawer-close" type="button" aria-label="Закрыть меню">
                <span aria-hidden="true"></span>
            </button>
        </div>

        <nav class="site-header__drawer-nav" aria-label="Навигация по&nbsp;странице">
            <a class="site-header__drawer-link" href="#tasks">Что делаем?</a>
            <a class="site-header__drawer-link" href="#pricing">Цены</a>
            <a class="site-header__drawer-link" href="#reviews">Отзывы</a>
            <a class="site-header__drawer-link" href="#faq">Частые вопросы</a>
            <a class="site-header__drawer-link" href="#contacts">Контакты</a>
        </nav>

        <ul class="site-header__drawer-notes" aria-label="Кратко о&nbsp;сервисе">
            <li>Краснодар и&nbsp;край</li>
            <li>Без посредников</li>
            <li>Безналичный расчёт</li>
            <li>Расчёт до&nbsp;выезда</li>
        </ul>

        <div class="site-header__drawer-contact">
            <a class="site-header__drawer-phone" href="tel:+79004658331">+7&nbsp;(900)&nbsp;465-83-31</a>
            <div class="site-header__drawer-social" aria-label="Мессенджеры">
                <a class="site-header__messenger" href="#contacts" aria-label="Написать в&nbsp;MAX">
                    <img src="/assets/img/social/MAX-ico.svg" alt="" width="22" height="22" decoding="async">
                </a>
                <a class="site-header__messenger" href="https://t.me/" target="_blank" rel="noopener noreferrer" aria-label="Написать в&nbsp;Telegram">
                    <img src="/assets/img/social/Telegram-ico.svg" alt="" width="22" height="22" decoding="async">
                </a>
                <a class="site-header__messenger" href="https://wa.me/79004658331" target="_blank" rel="noopener noreferrer" aria-label="Написать в&nbsp;WhatsApp">
                    <img src="/assets/img/social/WhatsApp-ico.svg" alt="" width="22" height="22" decoding="async">
                </a>
            </div>
            <a class="site-header__drawer-cta" href="#contacts" data-modal-open="modal-callback" data-cta-source="@@prefix-header-drawer-cta" data-modal-title="Заказать звонок оператора">Заказать звонок оператора</a>
        </div>
    </aside>
</header>
