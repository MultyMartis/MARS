<section class="wf-section wf-section--contact" id="contact" data-section data-block-id="contact_block" aria-labelledby="contact-title">
  <div class="wf-container wf-contact__inner">
    <div class="wf-contact__copy">
      <h2 class="wf-contact__title" id="contact-title">Contact</h2>
      <p class="wf-contact__text">Real tel: and mailto: links — no JS-only phone display.</p>
      <ul class="wf-contact__list">
        <li><a class="wf-contact__link" href="tel:+15551234567">+1 (555) 123-4567</a></li>
        <li><a class="wf-contact__link" href="mailto:hello@example.com">hello@example.com</a></li>
      </ul>
      <p class="wf-contact__hours"><strong>Hours:</strong> Mon–Fri 9:00–18:00 (demo timezone)</p>
    </div>
    <div class="wf-contact__map">
      <a class="wf-contact__map-link" href="https://maps.google.com/" target="_blank" rel="noopener noreferrer">
        Open map (placeholder)
      </a>
    </div>
  </div>
</section>
