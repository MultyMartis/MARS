<div class="wf-modal" data-module="modal" id="modal-callback" hidden aria-hidden="true">
  <div class="wf-modal__backdrop" data-modal-close tabindex="-1" aria-hidden="true"></div>
  <div class="wf-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-callback-title">
    <button type="button" class="wf-modal__close" data-modal-close aria-label="Close">&times;</button>
    <h2 class="wf-modal__title" id="modal-callback-title">Request a callback</h2>
    <p>Reference modal — focus trap, ESC, body lock active.</p>
    <button type="button" class="wf-form__submit" data-modal-close>Close</button>
  </div>
</div>
