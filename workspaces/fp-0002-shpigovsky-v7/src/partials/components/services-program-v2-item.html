<article class="services-program-v2__item">
  <div class="services-program-v2__item-media">
    <img
      class="services-program-v2__item-image"
      src="@@image"
      width="@@imageWidth"
      height="@@imageHeight"
      alt="@@imageAlt"
      loading="lazy"
      decoding="async"
    >
  </div>
  <div class="services-program-v2__item-body">
    <h3 class="services-program-v2__item-title">@@title</h3>
    <p class="services-program-v2__item-text">@@text</p>
  </div>
</article>
