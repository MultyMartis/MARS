<section class="home-final-form" aria-labelledby="home-final-form-heading">
  <div class="container">
    <div class="home-final-form__band">
      <div class="home-final-form__copy">
        <h2 class="home-final-form__heading" id="home-final-form-heading">Остались вопросы?</h2>
        <p class="home-final-form__lead">Опишите вашу ситуацию в&nbsp;форме заявки, и&nbsp;мы расскажем, как сможем помочь</p>
      </div>

      <form class="home-final-form__form" data-final-form action="#" method="post">
        <div class="home-final-form__row">
          <div class="home-final-form__field">
            <label class="home-final-form__label" for="home-final-form-name">Ваше имя</label>
            <input
              class="home-final-form__input"
              type="text"
              id="home-final-form-name"
              name="name"
              autocomplete="name"
              placeholder="Ваше имя"
              required
            >
          </div>
          <div class="home-final-form__field">
            <label class="home-final-form__label" for="home-final-form-phone">Ваш телефон</label>
            <input
              class="home-final-form__input"
              type="tel"
              id="home-final-form-phone"
              name="phone"
              data-phone-input
              placeholder="+7 999 999 - 99 - 99"
              autocomplete="tel"
              required
            >
          </div>
        </div>
        <div class="home-final-form__field home-final-form__field_message">
          <label class="home-final-form__label" for="home-final-form-message">Опишите ситуацию</label>
          <textarea
            class="home-final-form__textarea"
            id="home-final-form-message"
            name="message"
            rows="4"
            placeholder="Опишите ситуацию"
            required
          ></textarea>
        </div>
        <label class="home-final-form__consent">
          <input
            class="home-final-form__consent-input"
            type="checkbox"
            name="consent"
            value="1"
            required
          >
          <span class="home-final-form__consent-control" aria-hidden="true"></span>
          <span class="home-final-form__consent-text">Я&nbsp;даю согласие на&nbsp;обработку персональных данных в&nbsp;соответствии с&nbsp;<a class="home-final-form__consent-link" href="/consent-personal-data/">Согласием на&nbsp;обработку персональных данных</a> и&nbsp;соглашаюсь с&nbsp;<a class="home-final-form__consent-link" href="/privacy-policy/">Политикой конфиденциальности</a>.</span>
        </label>
        <button type="submit" class="btn btn_dark btn--primary home-final-form__submit">Записаться на&nbsp;консультацию</button>
      </form>
    </div>
  </div>
</section>
